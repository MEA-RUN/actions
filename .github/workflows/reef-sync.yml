name: Sync and deploy Reef site

on:
  workflow_call:
    inputs:
      source_repository:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      mode:
        required: true
        type: string
    secrets:
      REEF_APP_CLIENT_ID:
        required: true
      REEF_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.REEF_APP_CLIENT_ID }}
          private-key: ${{ secrets.REEF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: write
          permission-contents: read
          permission-metadata: read
          permission-pages: write

      - name: Checkout generated site
        uses: actions/checkout@v7.0.1
        with:
          path: site

      - name: Checkout subject
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.app-token.outputs.token }}
          path: source

      - name: Checkout automation
        uses: actions/checkout@v7.0.1
        with:
          repository: MEA-RUN/actions
          ref: main
          path: automation

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Synchronize generated files
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bun automation/scripts/sync.ts "${{ inputs.mode }}" site source "${{ inputs.source_repository }}"

      - name: Commit generated files
        working-directory: site
        run: |
          git config user.name "reef-bot"
          git config user.email "reef-bot@users.noreply.github.com"
          git add content public
          if git diff --cached --quiet; then
            echo "Generated files are already up to date"
          else
            git commit -m "chore: sync from ${{ inputs.source_repository }}@${{ inputs.source_sha }}"
            git push
          fi

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          enablement: true

      - name: Install dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build site
        working-directory: site
        env:
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          NUXT_SITE_URL: ${{ steps.pages.outputs.origin }}
          REEF_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/.output/public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

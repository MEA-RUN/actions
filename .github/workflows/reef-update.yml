name: Update Reef content

on:
  workflow_call:
    inputs:
      site_repository:
        description: Generated repository name
        required: false
        type: string
        default: ''
    secrets:
      REEF_APP_CLIENT_ID:
        required: true
      REEF_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.REEF_APP_CLIENT_ID }}
          private-key: ${{ secrets.REEF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-metadata: read

      - name: Request content sync
        uses: actions/github-script@v9.0.0
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          REQUESTED_SITE_REPOSITORY: ${{ inputs.site_repository }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const [owner, sourceName] = process.env.SOURCE_REPOSITORY.split('/')
            const repo = process.env.REQUESTED_SITE_REPOSITORY || `${sourceName}-site`
            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: 'reef-update',
              client_payload: {
                source_repository: process.env.SOURCE_REPOSITORY,
                source_sha: process.env.SOURCE_SHA,
                mode: 'content',
              },
            })
